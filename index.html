<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Wayfare — Travel expenses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="Wayfare home">
          <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4.5 16.8 19.2 7.2M7.1 19.4l9.8-14.8M4 7.7l16 8.6" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/></svg></span>
          <span>wayfare<span class="brand-period">.</span></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-view="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>Overview</button>
          <button class="nav-link" data-view="claims"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3.8h7l4.5 4.5v11.9H7a2 2 0 0 1-2-2V5.8a2 2 0 0 1 2-2Z"/><path d="M14 4v5h5M8.5 13h7M8.5 16.5h7"/></svg></span>My claims<span class="nav-count" id="nav-claim-count">3</span></button>
          <button class="nav-link" data-view="authorizations"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20V8l8-4 8 4v12M8 20v-6h8v6M3 20h18M9 9h.01M15 9h.01"/></svg></span>Authorizations</button>
          <button class="nav-link" data-view="policies"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none"><path d="m12 3 8 3v5.5c0 4.6-3.1 7.7-8 9.5-4.9-1.8-8-4.9-8-9.5V6l8-3Z"/><path d="m9 12 2 2 4-4"/></svg></span>Travel policies</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card"><span class="help-spark">✳</span><strong>Need a hand?</strong><p>Our travel team is here to help with your claims.</p><a href="mailto:travel@northstar.example">Contact support <span>↗</span></a></div>
          <button class="profile-button"><span class="avatar">JD</span><span class="profile-copy"><strong>Jordan Davis</strong><small>Product designer</small></span><span class="profile-menu">···</span></button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions"><span class="period-label">Travel workspace</span><button class="icon-button notification-button" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg><i></i></button><span class="avatar top-avatar">JD</span></div>
        </header>
        <div id="view-root"></div>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
